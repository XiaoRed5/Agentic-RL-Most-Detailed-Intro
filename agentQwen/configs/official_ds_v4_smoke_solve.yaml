step_models:
  SolveAgent: {model_name: "deepseek-v4-flash-sa-256k", max_tokens: 2048, temperature: 0.4}
  MockToolAgent: {model_name: "deepseek-v4-flash-sa-256k", max_tokens: 2048, temperature: 0.2}
processing: {max_workers: 1, max_tasks: 1}
logging:
  repeat_times: 1
  already_processed_path: "logs/agenticqwen_ds_v4_smoke_solved.jsonl"
  solve_path: "output/agenticqwen_ds_v4_smoke_solve/"
paths: {data_file: "output/agenticqwen_ds_v4_smoke_virtual_tool_use.jsonl"}
api_configs:
  "deepseek-v4-flash-sa-256k": {api_base: "AIGC_BASE_URL", api_key_env: "AIGC_APP_ID"}
