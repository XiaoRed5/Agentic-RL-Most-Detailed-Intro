<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behavioral Agentic RL on τ²-bench：一个免-SFT、全离线可验证的工业级信用分配与行为塑形实现</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  renderMathInElement(document.body, {
    delimiters: [
      {left: "$$", right: "$$", display: true},
      {left: "\\[", right: "\\]", display: true},
      {left: "$", right: "$", display: false},
      {left: "\\(", right: "\\)", display: false}
    ],
    throwOnError: false
  });
});
</script>
<style>
  :root{
    --ink:#1a1a1a; --muted:#555; --faint:#777; --rule:#d8d8d8;
    --link:#8b2635; --accent:#8b2635; --panel:#f7f6f3; --panel2:#f0efe9;
    --serif:"Latin Modern Roman","Computer Modern",Georgia,"Times New Roman",Times,"Songti SC","STSong",serif;
    --sans:"Latin Modern Sans","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB",sans-serif;
    --mono:"Latin Modern Mono","SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{font-size:16px}
  body{background:#fff;color:var(--ink);font-family:var(--serif);line-height:1.62;margin:0;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .paper{max-width:760px;margin:0 auto;padding:56px 28px 120px}
  /* ---------- 标题区 ---------- */
  .titleblock{text-align:center;margin-bottom:14px}
  .titleblock h1{font-size:25px;font-weight:700;line-height:1.34;letter-spacing:-.2px;margin:0 0 18px}
  .authors{font-size:15.5px;margin:6px 0 2px}
  .affil{font-size:12.5px;color:var(--muted);font-style:italic;margin:2px 0}
  .meta-line{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:12px;letter-spacing:.2px}
  /* ---------- 摘要 ---------- */
  .abstract{max-width:600px;margin:26px auto 8px;font-size:14px;line-height:1.6}
  .abstract .h{text-align:center;font-weight:700;font-size:14.5px;margin-bottom:8px;letter-spacing:.5px}
  .abstract p{margin:0 0 8px;text-align:justify;color:#222}
  .keywords{max-width:600px;margin:4px auto 0;font-size:12.5px;color:var(--muted);text-align:justify}
  .keywords b{color:var(--ink)}
  .rule{border:none;border-top:1px solid var(--rule);margin:30px 0}
  .rule.thin{margin:20px 0}
  /* ---------- 正文 ---------- */
  h2{font-size:17.5px;font-weight:700;margin:34px 0 12px;letter-spacing:-.1px}
  h3{font-size:14.5px;font-weight:700;margin:22px 0 8px}
  h4{font-size:13.5px;font-weight:700;font-style:italic;margin:16px 0 6px;color:#2a2a2a}
  p{margin:10px 0;text-align:justify;font-size:14.5px;hyphens:auto}
  .lead{font-size:15px}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}
  strong,b{font-weight:700}
  em,i{font-style:italic}
  sup{font-size:.72em;line-height:0}
  /* 行内代码 & 引用标记 */
  code{font-family:var(--mono);font-size:12.5px;background:var(--panel);padding:1px 5px;border-radius:3px;color:#7a1f2b}
  .cite{color:var(--link);font-size:13.5px}
  /* ---------- 列表 ---------- */
  ul,ol{margin:10px 0 10px 4px;padding-left:22px}
  li{margin:5px 0;font-size:14.5px;text-align:justify}
  ul.tight li{margin:2px 0}
  /* ---------- 图 ---------- */
  figure{margin:24px 0;text-align:center}
  figure .figbox{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:14px 12px;overflow-x:auto}
  figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
  figcaption{font-size:12.5px;color:#333;margin-top:10px;line-height:1.5;text-align:left;padding:0 6px}
  figcaption .lbl{font-weight:700}
  /* ---------- 表 ---------- */
  .tabwrap{margin:22px 0;overflow-x:auto}
  table.aca{border-collapse:collapse;width:100%;font-size:12.8px;font-family:var(--sans)}
  table.aca caption{caption-side:top;font-size:12.5px;color:#333;text-align:left;margin-bottom:8px;line-height:1.5;font-family:var(--serif)}
  table.aca caption .lbl{font-weight:700}
  table.aca thead th{border-top:1.5px solid var(--ink);border-bottom:1px solid var(--ink);
    padding:6px 9px;text-align:left;font-weight:700;vertical-align:bottom}
  table.aca tbody td{padding:5px 9px;border:none;vertical-align:top}
  table.aca tbody tr:last-child td{border-bottom:1.5px solid var(--ink)}
  table.aca .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
  table.aca .grp{border-bottom:1px solid var(--rule)}
  table.aca .best{font-weight:700}
  table.aca tbody tr:hover td{background:#faf9f6}
  /* ---------- 方程 ---------- */
  .eqn{margin:16px 0;text-align:center;overflow-x:auto}
  .eqn-num{display:flex;align-items:center;gap:14px;margin:16px 0}
  .eqn-num .body{flex:1;text-align:center;overflow-x:auto}
  .eqn-num .tag{color:var(--muted);font-size:13px;font-family:var(--serif)}
  /* ---------- 框：定义/算法/take-away ---------- */
  .algobox{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);margin:22px 0;padding:0}
  .algobox .cap{border-bottom:1px solid var(--rule);padding:7px 12px;font-size:12.8px;font-family:var(--sans)}
  .algobox .cap .lbl{font-weight:700}
  .algobox .body{padding:10px 14px;font-family:var(--mono);font-size:12px;line-height:1.65;color:#222}
  .algobox .body .kw{color:#7a1f2b;font-weight:700}
  .algobox .body .cm{color:#888}
  .algobox .body .ind{padding-left:20px}
  .algobox .body .ind2{padding-left:40px}
  .callout{border-left:3px solid var(--accent);background:var(--panel);padding:12px 16px;margin:18px 0;
    border-radius:0 4px 4px 0;font-size:13.8px}
  .callout .k{font-weight:700;font-family:var(--sans);font-size:12.5px;letter-spacing:.3px;
    text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .callout p{margin:4px 0;font-size:13.8px}
  .callout.finding{border-color:#1f6b3f;background:#f2f8f3}
  .callout.finding .k{color:#1f6b3f}
  .callout.limit{border-color:#9a6a10;background:#faf6ec}
  .callout.limit .k{color:#9a6a10}
  /* 代码块 */
  pre.code{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:12px 14px;
    overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.6;color:#222;margin:16px 0}
  pre.code .cm{color:#888}
  pre.code .g{color:#1f6b3f}
  pre.code .r{color:#7a1f2b}
  /* 脚注 / 页脚 */
  .footnote{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);margin-top:6px;padding-top:6px}
  footer.paper-foot{margin-top:56px;border-top:1px solid var(--rule);padding-top:16px;
    font-size:12px;color:var(--faint);text-align:center;font-family:var(--sans)}
  /* 章节间分隔在正文里用 h2 自然分隔 */
  @media(max-width:640px){
    .paper{padding:32px 16px 80px}
    .titleblock h1{font-size:21px}
  }
</style>
</head>
<body>
<div class="paper">
